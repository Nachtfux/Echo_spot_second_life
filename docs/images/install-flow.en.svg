<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="install-flow-title install-flow-desc" xml:lang="en">
  <title id="install-flow-title">./install.sh: the nine phases</title>
  <desc id="install-flow-desc">Flow of the nine phases of ./install.sh. doctor checks the tools on your computer. Group Unlock and ROM, done once with the USB cable: unlock (you download the amonet zip and do the three-button trick), backup, flash. Group Android setup: setup (you enable developer options), apps (you log in). Group Spot Second Life, repeatable and over Wi-Fi: voice, clock, verify. Phases marked with a hand need you to do something.</desc>
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>
  <rect x="2" y="2" width="1396" height="796" rx="28" fill="#FAF9F5" stroke="#DEDBD0" stroke-width="2"/>
  <text x="56" y="78" class="serif" font-size="34" fill="#141413">One script, nine phases</text>
  <text x="56" y="112" class="sans" font-size="18" fill="#5E5D59">./install.sh runs them in order and skips phases that are already done.</text>

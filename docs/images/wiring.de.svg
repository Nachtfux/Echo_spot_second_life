<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="wiring-title wiring-desc" xml:lang="de">
  <title id="wiring-title">Verkabelung: Rechner, USB-Kabel, Echo Spot und Netzteil</title>
  <desc id="wiring-desc">Ein Mac- oder Linux-Laptop führt ./install.sh aus und ist per USB-Datenkabel mit dem versteckten Micro-USB-Port auf der Rückseite des Echo Spot verbunden. Die Strombuchse des Spot bleibt am Original-Netzteil. Ein Datenkabel verwenden, kein reines Ladekabel. Nach dem Setup läuft adb über WLAN und das Kabel kann ab.</desc>
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>

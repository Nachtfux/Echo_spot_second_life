<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="voice-session-title voice-session-desc" xml:lang="de">
  <title id="voice-session-title">Ablauf eines Sprachgesprächs</title>
  <desc id="voice-session-desc">Zeitleiste: Du sagst Hey Claude. Der Spot wacht auf, die App öffnet sich und der Sprachmodus startet in etwa 3 Sekunden. Claude spricht, während EchoGuard dein Mikrofon stumm hält, dann sprichst du und so weiter. Das Gespräch endet mit Danke Claude, 10 Sekunden Stille, dem erneuten Wakeword oder der Power-Taste. Danach zeigt der Spot wieder die Uhr und hört zu. Mit ChatGPT genauso.</desc>
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>
  <rect x="2" y="2" width="1396" height="496" rx="28" fill="#FAF9F5" stroke="#DEDBD0" stroke-width="2"/>
  <text x="56" y="74" class="serif" font-size="34" fill="#141413">Ein Gespräch</text>
  <text x="56" y="108" class="sans" font-size="18" fill="#5E5D59">Beispiel mit Claude – mit ChatGPT läuft es genauso.</text>

  <text x="1006" y="340" class="sans" font-size="17" fill="#5E5D59"><tspan x="1006">„Danke Claude“</tspan><tspan x="1006" dy="24">oder 10 s Stille</tspan><tspan x="1006" dy="24">oder nochmal Wakeword</tspan><tspan x="1006" dy="24">oder Power-Taste</tspan></text>

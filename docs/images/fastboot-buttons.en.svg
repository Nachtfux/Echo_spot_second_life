  </g>
  </g>
  <text x="240" y="470" class="sans" font-size="16" fill="#FAF9F5" font-weight="600" text-anchor="middle">vol −</text>
  <text x="316" y="470" class="sans" font-size="16" fill="#FAF9F5" font-weight="600" text-anchor="middle">mic off</text>
  <text x="392" y="470" class="sans" font-size="16" fill="#FAF9F5" font-weight="600" text-anchor="middle">vol +</text>
  <path d="M650 196 L650 404" fill="none" stroke="#DEDBD0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="650" cy="196" r="20" fill="#D97757"/>
  <text x="650" y="203.2" class="serif" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
  <text x="690" y="194" class="sans" font-size="21" fill="#141413" font-weight="700">Unplug the power supply</text>
  <text x="690" y="222" class="sans" font-size="17" fill="#5E5D59">The Spot must be completely off.</text>
  <circle cx="650" cy="300" r="20" fill="#D97757"/>
  <text x="650" y="307.2" class="serif" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
  <text x="690" y="298" class="sans" font-size="21" fill="#141413" font-weight="700">Press and hold all three buttons</text>
  <text x="690" y="326" class="sans" font-size="17" fill="#5E5D59">vol −, mic off and vol + at the same time</text>
  <circle cx="650" cy="404" r="20" fill="#D97757"/>
  <text x="650" y="411.2" class="serif" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
  <text x="690" y="402" class="sans" font-size="21" fill="#141413" font-weight="700">Plug the power back in, keep holding</text>
  <text x="690" y="430" class="sans" font-size="17" fill="#5E5D59">Let go when the screen shows fastboot mode.</text>
  <path d="M650 434 L650 569.5 Q650 582 662.5 582 L675 582" fill="none" stroke="#D97757" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M682 582 L672 588.2 L672 575.8 Z" fill="#D97757" stroke="#D97757" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="769" cy="588" r="76" fill="#141413" fill-opacity="0.08"/>
  <circle cx="766" cy="582" r="76" fill="#0B0B0A" stroke="#3A3936" stroke-width="3"/>
  <circle cx="766" cy="582" r="68" fill="#141413"/>
  <text x="766" y="588" class="mono" font-size="16" fill="#FAF9F5" text-anchor="middle">fastboot mode</text>
  <text x="866" y="578" class="sans" font-size="17" fill="#5E5D59"><tspan x="866">Now the computer can talk to the</tspan><tspan x="866" dy="24">Spot: fastboot devices lists it.</tspan></text>
</svg>

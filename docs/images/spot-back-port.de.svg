  <circle cx="742" cy="458.48" r="4" fill="#D97757"/>
  <text x="756" y="640" class="sans" font-size="20" fill="#141413" font-weight="700">Versteckter Micro-USB</text>
  <text x="756" y="666" class="sans" font-size="17" fill="#5E5D59">unter verklebter Abdeckung</text>

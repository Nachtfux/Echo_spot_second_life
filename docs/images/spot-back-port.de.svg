<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="spot-back-port-title spot-back-port-desc" xml:lang="de">
  <title id="spot-back-port-title">Rückseite des Echo Spot: der versteckte Micro-USB-Port</title>
  <desc id="spot-back-port-desc">Rückansicht eines Echo Spot. Unten sitzen eine 3,5-mm-Audiobuchse, eine kleine verklebte Gummiabdeckung und die runde Strombuchse. Eine Vergrößerung zeigt die abgezogene Abdeckung und darunter den Micro-USB-Port zwischen Audio- und Strombuchse. Das Original-Netzteil bleibt angeschlossen; die Abdeckung mit einem dünnen Plastikwerkzeug lösen, kein Metall.</desc>

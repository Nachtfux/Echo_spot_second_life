  <text x="56" y="78" class="serif" font-size="34" fill="#141413">Die Rückseite des Echo Spot</text>
  <text x="56" y="112" class="sans" font-size="18" fill="#5E5D59">Zwischen den beiden Buchsen versteckt sich ein Micro-USB-Port.</text>

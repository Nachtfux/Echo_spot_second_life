      <stop offset="0" stop-color="#55534D"/>
      <stop offset="0.42" stop-color="#262523"/>
      <stop offset="1" stop-color="#0D0D0C"/>
    </radialGradient>
    <radialGradient id="back-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#141413" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#141413" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bp-zoom"><circle cx="742" cy="392" r="212"/></clipPath>
    <radialGradient id="bp-zoombg" cx="0.4" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#3A3935"/>
      <stop offset="1" stop-color="#121211"/>
    </radialGradient>
    <pattern id="bp-glue" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#6A6862"/>
      <circle cx="5.5" cy="5.5" r="0.9" fill="#5A5853"/>
    </pattern>
  </defs>

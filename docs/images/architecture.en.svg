<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="architecture-title architecture-desc" xml:lang="en">
  <title id="architecture-title">How Spot Voice works</title>
  <desc id="architecture-desc">Architecture. Microphone, then SilenceGate, which skips the neural networks in a quiet room, then openWakeWord on the Spot: melspectrogram.onnx, embedding_model.onnx and two classifiers sharing the embeddings, wake (Hey Claude, Hey ChatGPT) and stop (Danke Claude, Danke ChatGPT). After the wake word, Vosk offline speech recognition (German or English) and a command parser run local commands: Spotify, internet radio from radio-browser.info, timer and alarm on Spot Clock. Without a command, the accessibility service opens Claude or ChatGPT and taps its voice-mode button; only this voice mode runs in the cloud. EchoGuard watches the speaker output, mutes the assistant's microphone while it talks and ends the conversation after 10 s of silence, the stop word or the wake word. Spot Clock receives the STATE broadcast (listening or active) and shows now playing, timers and weather.</desc>
